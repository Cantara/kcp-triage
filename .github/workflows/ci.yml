# Until now this repository had `typecheck`, `test`, `build` and `lint` scripts and no
# workflow that ran any of them. The only checks on a pull request were Socket Security's
# two, which scan dependencies for supply-chain problems and never compile the code — so
# a dependency bump that broke the build reported green. A zod v4 bump was mergeable on
# that basis while producing four type errors, with every unit test still passing.
#
# `lint` is deliberately not a gate yet: biome reports 31 pre-existing findings on main,
# so making it blocking would fail every PR on debt it did not introduce. It runs
# non-blocking here to keep the number visible.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Guard - bun.lock is the only lockfile
        run: |
          if [ -e package-lock.json ] || [ -e npm-shrinkwrap.json ] || [ -e yarn.lock ] || [ -e pnpm-lock.yaml ]; then
            echo "::error::Only bun.lock is allowed; remove the other lockfile(s)."
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Guard - bun.lock is in sync with package.json
        run: git diff --exit-code -- bun.lock

      # Ordered cheapest-first so an obvious break fails fast.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Lint (non-blocking — 31 pre-existing findings)
        run: bun run lint || true
